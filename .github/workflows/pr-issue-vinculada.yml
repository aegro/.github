# Confere se a PR está ligada a uma issue: é a issue que liga o código à Entrega (ou ao Defeito, à
# Historia tecnica) e permite medir custo e entrega por iniciativa.
#
# Passa quando:
#   - o GitHub já liga a PR a uma issue para fechamento (`Closes`/`Fixes`/`Resolves` ou vínculo manual);
#   - a descrição cita uma issue da aegro (`Refs`/`Parte de` + URL, `aegro/<repo>#<n>` ou `#<n>`);
#   - a branch segue `<type>/<n>-<descrição>` (CONTRIBUTING.md);
#   - a descrição tem uma linha `Sem issue: <motivo>`;
#   - o autor é bot (dependabot, renovate, apps).
#
# Uso: chamado por um ruleset da org (required workflow) ou por um repo:
#   jobs:
#     issue:
#       uses: aegro/.github/.github/workflows/pr-issue-vinculada.yml@dev
#       with: { modo: avisar }   # avisar (padrão) | bloquear
#
# Segurança: título, corpo e branch vêm de quem abriu a PR. Nada disso entra em `${{ }}` dentro de
# `run:`; o script lê o evento com jq. Só leitura, sem checkout.
name: PR com issue vinculada

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      modo:
        description: "avisar (anota e passa) ou bloquear (falha o check)"
        type: string
        default: avisar

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  issue:
    name: issue vinculada
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir vínculo
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo || 'avisar' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ev="$GITHUB_EVENT_PATH"
          numero=$(jq -r '.pull_request.number' "$ev")
          corpo=$(jq -r '.pull_request.body // ""' "$ev")
          branch=$(jq -r '.pull_request.head.ref' "$ev")
          autor_tipo=$(jq -r '.pull_request.user.type' "$ev")
          autor=$(jq -r '.pull_request.user.login' "$ev")

          ok() { echo "✅ $1"; echo "✅ $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          if [ "$autor_tipo" = "Bot" ] || printf '%s' "$autor" | grep -qiE '\[bot\]$|^(dependabot|renovate)'; then
            ok "Autor é bot ($autor): checagem dispensada."
          fi

          dono=${REPO%%/*}; nome=${REPO#*/}
          ligadas=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences{totalCount}}}}' \
            -f o="$dono" -f r="$nome" -F n="$numero" -q '.data.repository.pullRequest.closingIssuesReferences.totalCount')
          [ "${ligadas:-0}" -gt 0 ] && ok "PR ligada a $ligadas issue(s) para fechamento."

          if printf '%s' "$corpo" | grep -Eqi '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|parte de|part of|relates? to)[[:space:]:]+(https://github\.com/aegro/[A-Za-z0-9_.-]+/issues/[0-9]+|aegro/[A-Za-z0-9_.-]+#[0-9]+|#[0-9]+)|github\.com/aegro/[A-Za-z0-9_.-]+/issues/[0-9]+'; then
            ok "A descrição cita uma issue."
          fi
          printf '%s' "$branch" | grep -Eq '^[a-z]+/[0-9]+-' && ok "Branch no formato <type>/<n>-<descrição>: issue #$(printf '%s' "$branch" | sed -E 's#^[a-z]+/([0-9]+)-.*#\1#')."
          printf '%s' "$corpo" | grep -Eqi '^[[:space:]]*sem issue:[[:space:]]*[^[:space:]]' && ok "Sem issue, com motivo declarado."

          msg="A PR não cita nenhuma issue. Inclua \`Closes https://github.com/aegro/<repo>/issues/<n>\` na descrição (ou \`Refs\`, se não fecha), use uma branch \`<type>/<n>-<descrição>\`, ou declare \`Sem issue: <motivo>\`."
          {
            echo "### ⚠️ PR sem issue vinculada"
            echo
            echo "$msg"
            echo
            echo "A issue liga o código à Entrega (ou ao Defeito, à Historia tecnica) e é o que permite medir custo e entrega por iniciativa."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODO" = "bloquear" ]; then
            echo "::error title=PR sem issue vinculada::$msg"
            exit 1
          fi
          echo "::warning title=PR sem issue vinculada::$msg"
